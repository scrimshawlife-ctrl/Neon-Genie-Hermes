name: Hermes Hub installation failure
description: hermes skills install / doctor fails for neon-genie
title: "[hub] "
labels: ["hub", "packaging"]
body:
  - type: input
    id: hermes_version
    attributes:
      label: Hermes version
      placeholder: hermes --version
    validations:
      required: false
  - type: input
    id: skill_version
    attributes:
      label: Neon Genie version (VERSION / envelope skill_version)
    validations:
      required: false
  - type: dropdown
    id: path
    attributes:
      label: Install path used
      options:
        - hermes skills install GitHub path
        - hermes skills tap + install
        - ./install.sh / clone
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command(s)
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Already tried
      options:
        - label: hermes skills inspect …
        - label: do doctor on installed skill
        - label: distribution_spine.py verify (maintainers)
