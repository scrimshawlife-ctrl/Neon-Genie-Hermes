name: Operator outcome feedback
description: Real-world result after a Neon Genie run (learning loop intake)
title: "[outcome] "
labels: ["feedback", "learning"]
body:
  - type: markdown
    attributes:
      value: |
        Structured intake for the learning ledger. Entries stay **PROPOSED** —
        nothing auto-applies to the skill corpus.
  - type: input
    id: run_id
    attributes:
      label: run_id (from run-envelope.json)
      description: Preferred linkage key for reconciliation
      placeholder: ng_run_…
    validations:
      required: false
  - type: input
    id: envelope_path
    attributes:
      label: Path to run-envelope.json (if local)
      placeholder: out/neon-genie/…/run-envelope.json
  - type: dropdown
    id: outcome_class
    attributes:
      label: Outcome class
      options:
        - proof_obtained
        - proof_failed
        - failed_opportunity
        - buyer_failure
        - brittle_integration
        - distribution_failure
        - anti_capture_failure
        - data_request_satisfied
        - other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened (1–5 sentences)
    validations:
      required: true
  - type: dropdown
    id: routing_quality
    attributes:
      label: Profile routing quality
      options:
        - correct
        - over_routed (too many profiles)
        - under_routed (missed profile)
        - wrong_profile
        - n/a
  - type: dropdown
    id: gate_quality
    attributes:
      label: Gate quality
      options:
        - correct_fail_closed
        - false_positive_block
        - false_negative_allowed
        - n/a
  - type: textarea
    id: gates
    attributes:
      label: Related gates (if known)
      placeholder: Q, D, AUTHORITY, …
  - type: checkboxes
    id: authority
    attributes:
      label: Confirm
      options:
        - label: This feedback does not request auto-canon or skill mutation
          required: true
