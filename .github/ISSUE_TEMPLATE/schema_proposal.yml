name: Schema / recipe proposal
description: Propose packet, envelope, or recipe changes
title: "[schema] "
labels: ["schema", "enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Packet schema
        - Run envelope
        - Recipe
        - Gate definition
        - Other
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      options:
        - additive (minor schema)
        - breaking (major schema)
        - unknown
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: consumers
    attributes:
      label: Downstream consumers (Wayfinder, etc.)
