name: Hermes Skill Evals

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skill integrity (do check)
        run: python scripts/neon_genie.py do check

      - name: Wave 3 packaging CLI regression
        run: python scripts/test_wave3_cli.py

      - name: Eval fixture invariants
        run: python scripts/run_fixture_invariants.py

      - name: Golden gate evals
        run: python scripts/neon_genie.py do eval

      - name: Golden prose transcripts
        run: python scripts/neon_genie.py do transcripts

      - name: Learning ledger smoke
        run: |
          python scripts/neon_genie.py do learn --class other --summary "ci smoke" --ledger out/neon-genie/learning-ledger.jsonl
          test -s out/neon-genie/learning-ledger.jsonl

      - name: Release version alignment
        run: python scripts/audit_release_version.py --strict

      - name: Route smoke (examples)
        run: |
          python scripts/neon_genie.py do route --request examples/product-audit.brief.yaml --json
          python scripts/neon_genie.py do route --request examples/zero-option.brief.yaml --json

      - name: Packaging recipes
        run: |
          python scripts/neon_genie.py do recipe --list
          python scripts/neon_genie.py do recipe --name product-audit --out out/neon-genie/product-audit
          python scripts/neon_genie.py do recipe --name zero-option --out out/neon-genie/zero-option
          python scripts/neon_genie.py do recipe --name zero-option-executable --out out/neon-genie/zero-option-executable
          python scripts/neon_genie.py do recipe --name fragmentation --out out/neon-genie/fragmentation

      - name: Sample packet validation
        run: |
          python scripts/neon_genie.py do validate --packet examples/packets/sample-opportunity.packet.json --type opportunity
          python scripts/neon_genie.py do validate --packet examples/packets/sample-receipt.packet.json --type receipt --strict-authority

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-genie-eval-artifacts
          path: out/neon-genie/
