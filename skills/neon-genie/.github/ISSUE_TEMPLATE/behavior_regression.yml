name: Behavior regression
description: Neon Genie violated a gate, label, or authority rule
title: "[behavior] "
labels: ["behavior", "regression"]
body:
  - type: markdown
    attributes:
      value: |
        Report a failure of evidence, authority, or OPEN→SEAL behavior.
        Prefer linking a `run_id` from `run-envelope.json`.
  - type: input
    id: run_id
    attributes:
      label: run_id (from run-envelope.json)
      placeholder: ng_run_…
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Claim labels (OBSERVED/INFERRED/SPECULATIVE/NOT_COMPUTABLE)
        - DataRequest / private gap
        - Public research attempt
        - Authority / advisory_only
        - Promotion / Gate D
        - Wayfinder change-control
        - Profile routing
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction (prompt, brief, or CLI)
    validations:
      required: true
